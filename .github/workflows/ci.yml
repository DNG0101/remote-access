name: CI

on:
  push:
    branches: ["main"]
    paths:
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.json"
      - "index.html"
      - "config.js"
      - "styles.css"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.json"
      - "index.html"
      - "config.js"
      - "styles.css"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: p2p-desk-ci-\${{ github.workflow }}-\${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Validate + browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Static checks
        run: npm run check

      - name: Unit + integration tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser E2E
        run: npm run test:e2e
